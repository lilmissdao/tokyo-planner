<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Tokyo Planner</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗼</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
:root{--ink:#1C2230;--ink-2:#4A5264;--ink-3:#8A91A2;--paper:#FFFFFF;--wash:#F1F3F6;--rule:#DFE3E9;--line:#1F3A93;--focus:#00A7DB;--r-sm:6px;--r-lg:14px;
font-family:"Zen Kaku Gothic New","Hiragino Sans","Segoe UI",system-ui,sans-serif;color:var(--ink)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow-x:hidden;max-width:100%}
body{background:var(--wash);display:grid;grid-template-columns:var(--pw,420px) minmax(0,1fr);height:100dvh;overflow:hidden;touch-action:manipulation}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
#panel{position:relative;background:var(--paper);display:flex;flex-direction:column;min-height:0;min-width:0;border-right:1px solid var(--rule);padding-top:env(safe-area-inset-top,0px)}
.resizer{position:absolute;top:0;right:-5px;width:10px;height:100%;cursor:col-resize;z-index:700;touch-action:none}
.resizer::after{content:"";position:absolute;left:4px;top:50%;width:2px;height:44px;margin-top:-22px;border-radius:2px;background:#C9CED6;opacity:0;transition:opacity .15s}
.resizer:hover::after,.resizer.drag::after{opacity:1}
header{padding:18px 20px 12px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
header h1{margin:0;font-weight:900;font-size:26px;letter-spacing:-.01em;line-height:1}
header h1 small{display:block;font-weight:500;font-size:13px;color:var(--ink-3);letter-spacing:0;margin-top:6px}
.home-pill{font-size:12px;color:var(--ink-2);text-align:right;max-width:170px;line-height:1.3}
.home-pill b{display:block;color:var(--ink);font-weight:700}
.pin.home .av{background:#E8B100}
nav.tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--rule)}
nav.tabs button{border:0;background:none;padding:10px 10px 12px;font-weight:700;font-size:15px;color:var(--ink-3);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}
nav.tabs .count{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:var(--line);color:#fff;font-size:11px;margin-left:4px;padding:0 5px;vertical-align:1px}
.tabpane{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0;padding:14px 18px 28px;overscroll-behavior:contain}
.tabpane[hidden]{display:none}
.av{--c:#888;--s:32px;width:var(--s);height:var(--s);border-radius:50%;background:var(--c);display:grid;place-items:center;flex:none;box-shadow:0 0 0 2px #fff,0 1px 3px rgba(28,34,48,.35)}
.av svg{width:62%;height:62%;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.av.anchor{border-radius:9px}
.av .emo{font-size:calc(var(--s) * .56);line-height:1;font-weight:400;font-style:normal}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:8px 4px;margin-bottom:14px}
.chip{display:flex;flex-direction:column;align-items:center;gap:5px;border:0;background:none;padding:4px 0;font-size:11px;font-weight:700;color:var(--ink-2)}
.chip .av{--s:40px}
.chip[aria-pressed="false"]{color:var(--ink-3)}
.chip[aria-pressed="false"] .av{background:#C9CED6}
.chip[data-favonly][aria-pressed="false"] .av{background:#fff;box-shadow:0 0 0 2px #E8B100}
.chip[data-favonly][aria-pressed="false"] .av svg{stroke:#E8B100}
.chip[data-favonly][aria-pressed="true"]{color:#8A6500}
.chip small{font-weight:500;color:var(--ink-3)}
.search{display:flex;gap:6px;margin-bottom:12px}
.search input{flex:1;border:1.5px solid var(--rule);border-radius:var(--r-sm);padding:9px 11px;background:var(--wash)}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:#fff;border-radius:var(--r-sm);padding:8px 12px;font-weight:700;font-size:14px;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.small{padding:5px 9px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}
.btn.danger{background:#C4001A;border-color:#C4001A}
.place{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 2px;border-bottom:1px solid var(--rule)}
.place>div{min-width:0}
.favbtn{border:0;background:none;padding:0;border-radius:50%;line-height:0}
.av.fav{box-shadow:0 0 0 2px #fff,0 0 0 5px #E8B100,0 2px 6px rgba(232,177,0,.45)}
.favstar{--c:#E8B100}
.grp{border:1.5px solid var(--rule);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.grp h2{margin:0;font-size:16px;font-weight:900}
.grp .gsub{font-size:12px;color:var(--ink-3);margin:2px 0 8px}
.grow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--rule)}
.grow h4{margin:0;font-size:14px;font-weight:700;line-height:1.3}
.grow .sub{font-size:12px;color:var(--ink-3)}
.grp .row2{margin-top:10px}
.place:last-child{border-bottom:0}
.place h3{margin:0 0 2px;font-size:15px;font-weight:700;line-height:1.3;cursor:pointer}
.place .stn{font-size:13px;color:var(--ink-2)}
.addr{display:flex;gap:4px;align-items:flex-start;font-size:12.5px;line-height:1.45;color:var(--ink-2);margin:1px 0 3px}
.addr .txt{min-width:0;overflow-wrap:anywhere}
.addr .txt.none{color:#A9B0BD;font-style:italic}
.copy{border:0;background:none;padding:2px;margin-top:-1px;border-radius:4px;color:var(--ink-3);flex:none;line-height:0}
.copy:hover{background:var(--wash);color:var(--ink)}
.copy svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pop .addr{margin:0 0 6px}
.rbtn{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--ink);background:var(--ink);color:#fff;display:grid;place-items:center;padding:0;flex:none}
.rbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.rbtn:hover{background:#2E3750}
.rbtn.on{background:var(--line);border-color:var(--line);color:#fff}
.rbtn.ghost{background:transparent;border-color:var(--rule);color:var(--ink);font-size:13px;font-weight:900;letter-spacing:1px}
.rbtn.ghost:hover{background:var(--wash)}
.ontrip{font-size:12px;font-weight:700;color:var(--line);margin-top:2px}
.place .note{font-size:13px;color:var(--ink-2);margin-top:4px;line-height:1.5;white-space:pre-wrap}
.place .note.empty-bio{color:#A9B0BD;font-style:italic}
.place .acts{display:flex;flex-direction:column;gap:4px;align-items:flex-end;position:relative}
.place.sel{background:linear-gradient(90deg,var(--wash),transparent)}
.place.drop{outline:2px dashed var(--line);outline-offset:-2px;background:rgba(31,58,147,.05)}
.editable{border-radius:4px;cursor:text}
.editable:hover{background:rgba(31,58,147,.06)}
.editable[contenteditable="true"]{background:#FFF8E6;outline:2px solid #F39700;outline-offset:1px;padding:2px 4px;cursor:text;font-style:normal;color:var(--ink)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--wash);color:var(--ink-2);margin-left:4px;vertical-align:1px}
.empty{color:var(--ink-3);font-size:14px;padding:24px 4px;line-height:1.6}
.thumbs{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
.thumbs img{width:58px;height:58px;object-fit:cover;border-radius:8px;background:var(--wash);cursor:zoom-in;display:block}
.addphoto{width:58px;height:58px;border:1.5px dashed #C3C9D3;border-radius:8px;background:none;color:var(--ink-3);font-size:11px;font-weight:700;line-height:1.2}
.addphoto:hover{border-color:var(--ink);color:var(--ink)}
.menu{position:absolute;right:0;top:calc(100% + 4px);z-index:50;background:#fff;border:1.5px solid var(--rule);border-radius:10px;box-shadow:0 8px 24px rgba(28,34,48,.16);padding:4px;display:grid;min-width:190px}
.menu button{border:0;background:none;text-align:left;padding:9px 10px;border-radius:6px;font-size:13px;font-weight:700}
.menu button:hover{background:var(--wash)}
.menu .danger{color:#C4001A}
.group{margin-bottom:18px}
.group h2{font-size:16px;font-weight:900;margin:0 0 4px;display:flex;justify-content:space-between;align-items:baseline}
.group h2 span{font-size:12px;font-weight:500;color:var(--ink-3)}
.group.pending h2{color:#B35C00}
.trow{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule)}
.trow:last-child{border-bottom:0}
.trow h4{margin:0;font-size:14px;font-weight:700;line-height:1.3}
.trow .sub{font-size:12px;color:var(--ink-3)}
.trow select{border:1.5px solid var(--rule);border-radius:6px;padding:4px 6px;background:var(--paper);font-size:12px;font-weight:700;max-width:110px}
.group.pending .trow select{border-color:#F39700}
.xbtn{border:0;background:none;width:28px;height:28px;border-radius:6px;color:var(--ink-3);font-size:14px}
.xbtn:hover{background:var(--wash);color:var(--ink)}
.daylink{border:0;background:none;padding:0;font:inherit;font-weight:900;color:var(--ink);text-align:left;cursor:pointer}
.daylink:hover{color:var(--line);text-decoration:underline}
.viewdir{border:1.5px solid var(--rule);background:var(--paper);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;color:var(--line)}
.viewdir:hover{border-color:var(--line)}
.trow.homebreak h4{color:var(--ink-2)}
.pop select{border:1.5px solid var(--rule);border-radius:6px;padding:5px 6px;font-size:12px;font-weight:700;background:#fff;margin-bottom:8px;width:100%}
.addhome{border:1.5px dashed #C3C9D3;background:none;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:700;color:var(--ink-2);margin-top:6px}
.addhome:hover{border-color:var(--ink);color:var(--ink)}
.triphead{position:relative;z-index:1;margin:8px 0 4px 44px;display:inline-block;background:var(--line);color:#fff;font-size:12px;font-weight:900;border-radius:999px;padding:2px 10px}
.addstop{margin-left:44px;padding:2px 0 8px}
.addstop select{border:1.5px dashed #C3C9D3;border-radius:8px;padding:6px 8px;font-size:13px;font-weight:700;background:#fff;color:var(--ink-2);max-width:100%}
.addstop select:hover{border-color:var(--ink)}
.days{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.days button{border:1.5px solid var(--rule);background:var(--paper);border-radius:999px;padding:5px 12px;font-weight:700;font-size:13px}
.days button[aria-pressed="true"]{background:var(--line);border-color:var(--line);color:#fff}
.opts{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--ink-2);margin-bottom:14px;flex-wrap:wrap}
.totals{display:flex;gap:18px;padding:12px 14px;background:var(--wash);border-radius:var(--r-lg);margin-bottom:16px}
.totals div{font-size:12px;color:var(--ink-2)}
.totals b{display:block;font-size:22px;font-weight:900;color:var(--ink);line-height:1.1}
ol.strip{list-style:none;margin:0;padding:0;position:relative}
ol.strip::before{content:"";position:absolute;left:14px;top:16px;bottom:16px;width:6px;background:var(--line);border-radius:3px}
.stop{position:relative;display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:6px 0}
.stop .av{--s:34px;position:relative;z-index:1}
.stop .num{position:absolute;left:-5px;top:-1px;z-index:2;background:var(--ink);color:#fff;font-size:10px;font-weight:900;border-radius:999px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 3px;border:2px solid #fff}
.stop h4{margin:0;font-size:15px;font-weight:700;line-height:1.25}
.stop .sub{font-size:12px;color:var(--ink-3)}
.stop .ctl{display:flex;gap:2px}
.stop .ctl button{border:0;background:none;width:28px;height:28px;border-radius:6px;color:var(--ink-2);font-size:15px}
.stop .ctl button:hover{background:var(--wash)}
.leg{margin-left:44px;padding:6px 0 10px;font-size:13px;color:var(--ink-2)}
.leg .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.leg select{border:1.5px solid var(--rule);border-radius:6px;padding:3px 6px;background:var(--paper);font-size:12px;font-weight:700}
.leg .num2{font-weight:900;color:var(--ink);font-size:14px}
.leg ul{margin:6px 0 0;padding:0;list-style:none}
.leg li{display:flex;gap:8px;align-items:baseline;line-height:1.5}
.leg li i{font-style:normal;flex:none;width:44px;font-weight:700;font-size:11px;color:var(--ink)}
.leg a{color:var(--line);font-weight:700;text-decoration:none;font-size:12px}
.leg a:hover{text-decoration:underline}
.est{font-size:12px;color:var(--ink-3);line-height:1.5;margin-top:16px}
.hint{font-size:13px;color:var(--ink-3);line-height:1.5}
.row2{display:flex;gap:8px;flex-wrap:wrap}
hr{border:0;border-top:1px solid var(--rule);margin:18px 0}
#mapwrap{position:relative;min-height:0}
#map{position:absolute;inset:0;background:#F2F2EF}
.maptools{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:500;display:flex;flex-direction:column;gap:6px}
.maptools button{background:#fff;border:1.5px solid var(--rule);border-radius:8px;padding:7px 10px;font-weight:700;font-size:13px;box-shadow:0 1px 2px rgba(28,34,48,.12)}
.maptools button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.legend{position:absolute;left:12px;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:500;display:flex;gap:6px;background:rgba(255,255,255,.94);border:1.5px solid var(--rule);border-radius:999px;padding:6px 8px;max-width:calc(100% - 80px);overflow-x:auto;box-shadow:0 1px 3px rgba(28,34,48,.15)}
.legend button{border:0;background:none;padding:0;border-radius:50%}
.legend .av{--s:30px;box-shadow:none}
.legend button[aria-pressed="false"] .av{background:#C9CED6}
.picking{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:600;background:var(--ink);color:#fff;padding:8px 14px;border-radius:999px;font-weight:700;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:3000;background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.dlg{position:fixed;inset:0;z-index:4000;background:rgba(15,18,26,.45);display:grid;place-items:center;padding:20px}
.dlg[hidden]{display:none}
.dlgbox{background:#fff;border-radius:16px;padding:18px 18px 14px;width:min(360px,100%);box-shadow:0 18px 48px rgba(0,0,0,.3);display:grid;gap:12px;max-height:80vh;overflow:auto}
.dlgbox p{margin:0;font-size:15px;line-height:1.45;color:var(--ink);white-space:pre-line}
.dlgbox input{border:1.5px solid var(--rule);border-radius:8px;padding:9px 11px;font-size:16px;width:100%}
.dlgbtns{display:flex;gap:8px;justify-content:flex-end}
.dlgbtns .btn.danger{background:#C4001A;border-color:#C4001A}
.dlgpick{display:grid;gap:6px}
.cated{width:min(480px,100%);max-height:min(86vh,calc(100dvh - 32px));display:flex;flex-direction:column;overflow:hidden;gap:10px;position:relative}
.cated #catEdScroll{padding-right:30px}
.cetrack{position:absolute;right:4px;width:30px;touch-action:none}
.cetrack[hidden]{display:none}
.cethumb{position:absolute;left:4px;width:22px;height:64px;border-radius:11px;background:var(--ink);opacity:.82;box-shadow:0 2px 8px rgba(28,34,48,.3);display:grid;align-content:center;justify-items:center;gap:3px;touch-action:none;cursor:grab}
.cethumb i{display:block;width:10px;height:2px;border-radius:1px;background:#fff;opacity:.85}
.cethumb.drag{opacity:1;cursor:grabbing}
/* only the list scrolls; the title and Done stay put */
#catEdScroll{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;display:grid;gap:10px;align-content:start;padding-bottom:2px}
.cehead{display:flex;align-items:center;gap:8px}
.cehead h2{margin:0 auto 0 0;font-size:18px}
.cehint{font-size:13px!important;color:var(--ink-3)!important}
#catEdList{display:grid;gap:6px}
.cerow{display:grid;grid-template-columns:40px minmax(0,1fr) auto 34px 34px 34px;align-items:center;gap:4px;border:1.5px solid var(--rule);border-radius:12px;padding:5px 6px}
.cerow .ceicon{border:0;background:none;padding:0;display:grid;place-items:center}
.cerow .ceicon[aria-expanded="true"] .av{outline:2.5px solid var(--focus);outline-offset:2px}
.dlgbox .cerow .cename{padding:7px 8px;font-weight:700}
.cerow small{color:var(--ink-3);font-size:11px;white-space:nowrap}
.cerow>button:not(.ceicon){border:1.5px solid var(--rule);background:#fff;border-radius:8px;height:34px;font-size:16px;font-weight:700;color:var(--ink-2);padding:0}
.cerow>button:disabled{opacity:.3}
.cerow>button.cex{color:#C4001A}
.cestyle{grid-column:1/-1;display:grid;gap:8px;padding:6px 2px 4px}
.cestyle b{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3)}
.cegrid{display:flex;flex-wrap:wrap;gap:6px}
.cegrid button{border:2px solid transparent;background:none;border-radius:50%;padding:1px;display:grid;place-items:center}
.cegrid button[aria-pressed="true"]{border-color:var(--ink)}
.cegrid .sw{width:30px;height:30px;border-radius:50%;background:var(--c)}
.cecustom{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink-2)}
.dlgbox .cecustom input{width:44px;height:30px;padding:0 2px}
.dlgbox .cecustom input[data-ce="emoji"]{width:56px;height:38px;text-align:center;font-size:22px}
.ceai{display:grid;gap:8px;justify-items:start}
.ceerr{font-size:13px;color:#C4001A;font-weight:700}
.dlgpick button{text-align:left;border:1.5px solid var(--rule);background:#fff;border-radius:10px;padding:9px 11px;font-size:14px;font-weight:700}
.dlgpick button small{display:block;font-weight:500;color:var(--ink-3);font-size:12px}
.lightbox{position:fixed;inset:0;z-index:2000;background:rgba(15,18,26,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:12px}
.lightbox[hidden]{display:none}
.lightbox img{max-width:100%;max-height:74vh;border-radius:10px;object-fit:contain}
.lightbox .cap{color:#fff;font-weight:700;font-size:15px;text-align:center}
.lightbox .cap small{display:block;font-weight:500;color:#AEB5C2;font-size:12px;margin-top:2px}
.lightbox .row2 .btn.ghost{color:#fff;border-color:#4A5264}
.pin{position:relative}
.pin .badge{position:absolute;right:-9px;top:-9px;background:var(--ink);color:#fff;border:2px solid #fff;font-size:11px;font-weight:900;border-radius:999px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 4px}
.stnpin{width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid #5B6475}
.leaflet-popup-content{font-family:inherit;margin:12px 14px;min-width:210px}
.pop img.hero{width:100%;height:120px;object-fit:cover;border-radius:8px;margin-bottom:8px;display:block;background:var(--wash)}
.pop h3{margin:0 0 4px;font-size:15px}
.pop p{margin:0 0 8px;font-size:13px;color:var(--ink-2);line-height:1.4;white-space:pre-wrap}
.pop .row2 .btn{font-size:12px;padding:5px 8px}
.stnlabel{background:#fff;border:1.5px solid #5B6475;border-radius:4px;font-weight:700;font-size:11px;padding:1px 5px;box-shadow:none}
.stnlabel::before{display:none}

function routeStops(){
  const d=day(),h=byId(S.homeId);
  let list=d.stops.map((id,idx)=>({p:byId(id),idx})).filter(x=>x.p);
  if(d.loop&&h&&list.length)list=[{p:h,idx:-1},...list,{p:h,idx:-1}];
  const out=[];
  for(const x of list){const last=out[out.length-1];if(last&&last.p.id===x.p.id){if(last.idx<0&&x.idx>=0)out[out.length-1]=x;continue;}out.push(x);}
  return out;
}
function renderMarkers(){
  placeLayer.clearLayers();markers={};
  const order={};day().stops.forEach((id,i)=>{(order[id]??=[]).push(i+1)});
  S.places.forEach(p=>{
    if(!visible(p))return;
    const n=order[p.id]?`<span class="badge">${order[p.id].join(',')}</span>`:'';
    const sz=p.cat==='anchor'?36:32;
    const icon=L.divIcon({className:'',html:`<div class="pin${p.id===S.homeId?' home':''}">${avf(p,sz)}${n}<span class="plabel">${esc(p.name)}</span></div>`,iconSize:[sz,sz],iconAnchor:[sz/2,sz/2]});
    const m=L.marker([p.lat,p.lng],{icon,title:p.name,riseOnHover:true,zIndexOffset:p.cat==='anchor'?400:0}).addTo(placeLayer);
    m.on('click',()=>{if(popupPlaceId===p.id)showInList(p.id);else openMini(p.id);});
    markers[p.id]=m;
  });
  S.layers.forEach(l=>{
    if(S.hidden.includes(l.id))return;
    const onlyPinned=l.pinnedOnly&&l.items.some(d=>d.pin);
    l.items.forEach(d=>{
      if(onlyPinned&&!d.pin)return;
      if(!amenOk(d))return;
      const sz=d.pin?18:14;
      const m=L.marker([d.lat,d.lng],{icon:L.divIcon({className:'',html:`<div class="dot${d.pin?' pin':''}" style="--c:${l.color}"></div>`,iconSize:[sz,sz],iconAnchor:[sz/2,sz/2]}),title:d.name,riseOnHover:true,zIndexOffset:d.pin?-100:-200}).addTo(placeLayer);
      m.on('click',()=>{if(popupPlaceId===d.id)showInList(d.id);else openMini(d.id);});
      markers[d.id]=m;
    });
  });
}
function tripLabel(id){const ds=[...new Set(daysOf(id).map(d=>d.name))];if(!ds.length)return '';return ds.length>2?`${ds[0]} +${ds.length-1} more`:ds.join(', ');}

async function loadMiniG(p){

function refreshPopup(){if(!mini||!popupPlaceId)return;const p=byId(popupPlaceId);if(!p){map.closePopup(mini);return;}mini.setContent(miniHtml(p));hydrate(mini.getElement());}
function highlightRow(id){document.querySelectorAll('.place,.dotrow').forEach(el=>el.classList.toggle('sel',el.dataset.id===id));}

/* map center that puts a place a bit below the middle, leaving room for its card above */
function lowCenter(ll,z){const pt=map.project(ll,z).subtract([0,map.getSize().y*0.16]);return map.unproject(pt,z);}
function showInList(id){
  const p=byId(id);if(!p)return;
  const wasCollapsed=document.body.classList.contains('collapsed');
  setCollapsed(false);showTab('places');
  const lay=layerOf(id);
  if(lay){S.hidden=S.hidden.filter(c=>c!==lay.id);openLayers.add(lay.id);openDot=id;save();loadMiniG(p);}
  else{
    if(!visible(p)){S.hidden=S.hidden.filter(c=>c!==p.cat);save();}
    const q=$('#q').value.trim().toLowerCase();if(q&&!(p.name+' '+p.notes).toLowerCase().includes(q))$('#q').value='';
  }
  selected=id;refresh();
  setTimeout(()=>{
    if(wasCollapsed&&mini&&popupPlaceId===id)map.panTo(lowCenter([p.lat,p.lng],map.getZoom()));
    const sel=`.place[data-id="${id}"],.dotrow[data-id="${id}"]`;
    const row=document.querySelector(sel);if(!row)return;
    row.scrollIntoView({block:lay?'center':'start'});
    /* photos loading into rows above can push it down, so line it up again */
    [400,1000].forEach(t=>setTimeout(()=>{if(selected===id)document.querySelector(sel)?.scrollIntoView({block:lay?'center':'start'});},t));
    row.classList.remove('flash');void row.offsetWidth;row.classList.add('flash');
  },wasCollapsed?120:0);
}
function fitPlaces(ps){
  if(!ps.length)return;
  if(sheetState()==='full')setSheet('half');
  map.closePopup();
  if(ps.length===1)return map.flyTo([ps[0].lat,ps[0].lng],map.getZoom(),{duration:.6});
  const b=L.latLngBounds(ps.map(p=>[p.lat,p.lng]));
  map.flyTo(b.getCenter(),Math.min(map.getZoom(),map.getBoundsZoom(b,false,L.point(80,110))),{duration:.6});
}

/* ---------- Google places: search, details, photos, reviews ---------- */
let G_OK=null;const GCACHE={};let gResults=[],searchMarker=null,sheetCtx=null,linkTarget=null;
function sharedWord(a,b){const w=x=>x.toLowerCase().split(/[^a-z0-9]+/).filter(t=>t.length>3);const A=new Set(w(a));return w(b).some(t=>A.has(t));}
function nearMatch(r){
  if(r.lat==null)return null;
  const c=S.places.filter(p=>p.gid!==r.id).map(p=>({p,d:miles(p,{lat:r.lat,lng:r.lng})})).filter(o=>o.d<0.3).sort((a,b)=>a.d-b.d);
  const byName=c.find(o=>sharedWord(o.p.name,r.name||''));
  return (byName||(c[0]&&c[0].d<0.05?c[0]:null))?.p||null;
}
function linkPlace(pid){
  const p=byId(pid);if(!p||!sheetCtx)return;
  const {r}=sheetCtx,d=r.id&&GCACHE[r.id];
  if(r.src==='g'){p.gid=r.id;delete p.gtried;}
  if(!p.address&&(d?.formattedAddress||r.addr))p.address=d?.formattedAddress||r.addr;
  sheetCtx.mine=p;linkTarget=null;save();refresh();renderSheet(d||null);searchMarker?.remove();searchMarker=null;
  toast(`Linked. ${p.name} now shows Google photos and reviews.`);
}
async function gapi(params){
  const r=await fetch('/api/places?'+new URLSearchParams(params));
  if(r.status===503){G_OK=false;throw new Error('not_configured');}
  if(!r.ok)throw new Error('http '+r.status);
  G_OK=true;return r.json();
}
const gphoto=(name,w)=>`/api/photo?name=${encodeURIComponent(name)}&w=${w||400}`;
async function gdetails(id){if(GCACHE[id])return GCACHE[id];const j=await gapi({action:'details',id});GCACHE[id]=j;return j;}
const fmtCount=n=>(n||0).toLocaleString('en-US');
function guessCat(types){const k=guessCat0(types);return CATS[k]?k:'other';}
function guessCat0(types){
  const t=' '+(types||[]).join(' ')+' ';
  if(/lodging|hotel|hostel|inn |guest_house/.test(t))return /spa|onsen|hot_spring/.test(t)?'onsen':'housing';
  if(/spa|hot_spring|public_bath|sauna/.test(t))return 'onsen';
  if(/restaurant|cafe|bakery| bar |food|meal|coffee|dessert|ice_cream|confectionery/.test(t))return 'food';
  if(/park|natural_feature|hiking|garden|beach|mountain|campground|nature/.test(t))return 'nature';
  if(/museum|temple|shrine|church|place_of_worship|historical|monument|cultural|art_gallery|landmark/.test(t))return 'culture';
  if(/amusement|aquarium|zoo|bowling|arcade|movie|night_club|tourist_attraction|event_venue|karaoke/.test(t))return 'fun';
  if(/store|shop|market|mall|clothing|jewelry|book|supermarket/.test(t))return 'shopping';
  if(/train_station|subway|transit|airport|bus_station/.test(t))return 'anchor';
  return 'other';
}
function showSearchPin(lat,lng){searchMarker?.remove();searchMarker=L.marker([lat,lng],{icon:L.divIcon({className:'',html:'<div class="searchpin"></div>',iconSize:[22,22],iconAnchor:[11,11]}),zIndexOffset:900}).addTo(map);}
let searchTok=0,liveT;
function showRes(on){$('#gres').hidden=!on;$('#gfold').hidden=!on;syncGx();if(on)fitRes();}
/* ✕ shows whenever there is text; it clears the search completely */
function syncGx(){$('#gx').hidden=!$('#gq').value;}
function clearSearch(){clearTimeout(liveT);searchTok++;$('#gq').value='';gResults=[];gOpen=-1;pinNameVal=null;$('#gres').innerHTML='';showRes(false);searchMarker?.remove();searchMarker=null;$('#gq').blur();}
/* swipe the results up (from the handle, or once the list is scrolled to its end) to collapse them */
(function(){
  let y0=0,armed=false;
  const start=e=>{const r=$('#gres');armed=!!e.target.closest('#gfold')||r.scrollTop+r.clientHeight>=r.scrollHeight-2;y0=e.touches[0].clientY;};
  const end=e=>{if(armed&&(e.changedTouches[0]?.clientY??y0)-y0<-50)showRes(false);armed=false;};
  ['gres','gfold'].forEach(id=>{$('#'+id).addEventListener('touchstart',start,{passive:true});$('#'+id).addEventListener('touchend',end);});
  $('#gfold').onclick=()=>showRes(false);
})();
/* keep the results inside the map area so they never run into the dashboard */
function fitRes(){const r=$('#gres');if(r.hidden)return;const m=$('#mapwrap').getBoundingClientRect(),top=r.getBoundingClientRect().top;r.style.maxHeight=Math.max(160,m.bottom-top-40)+'px';}
addEventListener('resize',fitRes);
/* tapping anywhere outside the search box or its results closes the results */
document.addEventListener('pointerdown',e=>{if(!$('#gres').hidden&&!e.target.closest('.gsearch'))showRes(false);},true);
$('#gform').onsubmit=e=>{e.preventDefault();clearTimeout(liveT);doSearch();};
$('#gq').addEventListener('keydown',e=>{if(e.key==='Escape'){clearTimeout(liveT);showRes(false);}});
$('#gq').addEventListener('focus',()=>{if($('#gres').innerHTML)showRes(true);});
$('#gq').addEventListener('click',()=>{if($('#gres').innerHTML&&$('#gres').hidden)showRes(true);});
/* typing clears the old results, then searches for the new text once typing pauses */
$('#gq').addEventListener('input',()=>{
  syncGx();
  clearTimeout(liveT);searchTok++;gResults=[];gOpen=-1;pinNameVal=null;$('#gres').innerHTML='';showRes(false);searchMarker?.remove();searchMarker=null;
  if($('#gq').value.trim().length>=3)liveT=setTimeout(doSearch,600);
});
$('#gx').onclick=clearSearch;
async function doSearch(){
  const q=$('#gq').value.trim();if(!q)return;
  const tok=++searchTok;gOpen=-1;
  const c=map.getCenter(),box=$('#gres');showRes(true);box.innerHTML='<p class="hint" style="padding:10px 12px;margin:0">Searching…</p>';
  if(G_OK===false)return osmSearch(q,tok);
  try{
    const j=await gapi({action:'search',q,lat:c.lat.toFixed(5),lng:c.lng.toFixed(5)});
    if(tok!==searchTok)return;
    gResults=(j.places||[]).map(p=>({src:'g',id:p.id,name:p.displayName?.text||'Place',addr:p.formattedAddress||'',lat:p.location?.latitude,lng:p.location?.longitude,rating:p.rating,count:p.userRatingCount,type:p.primaryTypeDisplayName?.text||'',types:p.types||[],photo:p.photos?.[0]?.name}));
    renderResults();
  }catch(err){if(tok!==searchTok)return;if(G_OK===false){toast('Google is not connected yet, so results come from OpenStreetMap.');osmSearch(q,tok);}else box.innerHTML='<p class="hint" style="padding:10px 12px;margin:0">Search did not work. Check your connection and try again.</p>';}
}
async function osmSearch(q,tok){
  const box=$('#gres');
  try{const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=8&countrycodes=jp&accept-language=en&q=${encodeURIComponent(q)}`);const j=await r.json();
    if(tok!==searchTok)return;
    gResults=j.map(x=>({src:'osm',name:x.name||x.display_name.split(',')[0],addr:x.display_name,lat:+x.lat,lng:+x.lon,type:(x.type||'').replace(/_/g,' '),types:[x.type||'']}));
    renderResults();
  }catch(e){if(tok===searchTok)box.innerHTML='<p class="hint" style="padding:10px 12px;margin:0">Search is unavailable right now.</p>';}
}
let gOpen=-1,pinNameVal=null;
function findDot(r){for(const l of S.layers)for(const d of l.items)if((r.id&&d.gid===r.id)||(Math.abs(d.lat-r.lat)<1e-5&&Math.abs(d.lng-r.lng)<1e-5))return {l,d};return null;}
function renderResults(){
  const box=$('#gres');
  if(!gResults.length){box.innerHTML='<p class="hint" style="padding:10px 12px;margin:0">No places found. Try another name or spelling.</p>';return;}
  const lt=linkTarget&&byId(linkTarget);
  const q=$('#gq').value.trim();
  const catName=pinNameVal??(S.layers.find(l=>l.q.toLowerCase()===q.toLowerCase())?.name||q);
  const head=!lt&&q?`<div class="pinall"><span>Add every “${esc(q)}” in this map view to a category:</span><input id="pinName" value="${esc(catName)}" aria-label="Category name" maxlength="40"><button type="button" data-pinall="1">Add all in view</button></div>`:'';
  const top=box.scrollTop;
  box.innerHTML=head+(lt?`<div class="linkhead"><span>Pick the result that matches <b>${esc(lt.name)}</b></span><button type="button" data-cancel-link="1">Cancel</button></div>`:'')+gResults.map((r,i)=>{
    const open=i===gOpen,f=open&&findDot(r);
    return `<div class="gr${open?' open':''}"><button type="button" class="grh" data-gi="${i}" aria-expanded="${open}">${r.photo?`<img src="${gphoto(r.photo,120)}" alt="" loading="lazy">`:'<span class="noimg"></span>'}<span><b>${esc(r.name)}</b>${r.rating?`<small><span class="stars">★ ${r.rating.toFixed(1)}</span> (${fmtCount(r.count)})${r.type?', '+esc(r.type):''}</small>`:r.type?`<small>${esc(r.type)}</small>`:''}${open?'':`<small>${esc(r.addr)}</small>`}</span></button>
      ${open?`<div class="gmore">${r.addr?`<div class="mline"><button class="copy" onclick="app.copyText(this.dataset.t,event)" data-t="${esc(r.addr)}" aria-label="Copy address" title="Copy address">${COPY_ICON}</button><span style="white-space:normal">${esc(r.addr)}</span></div>`:''}
        ${infoHtml(r.src==='g'?r.id:null,{rating:r.rating,count:r.count,photo:r.photo},'data-gthumb="1"')}
        ${/lodging|hotel|inn|hostel|guest_house|ryokan|resort/.test((r.types||[]).join(' '))&&r.lat!=null?hotelHtml({lat:r.lat,lng:r.lng},true):''}
        <div class="row2">${q&&!lt?`<button type="button" class="btn small" data-gpin="${i}">${f&&f.d.pin?'Unpin':'Pin'}</button>`:''}<button type="button" class="btn ghost small" data-gopen="${i}">${lt?'Link this place':'More details'}</button></div></div>`:''}</div>`;
  }).join('');
  box.scrollTop=top;
}
/* pin one search result: it goes to the top of the category named above, with a gold ring */
function pinOne(r){
  const f=findDot(r);
  if(f){f.d.pin=!f.d.pin;S.hidden=S.hidden.filter(x=>x!==f.l.id);save();refresh();renderResults();toast(f.d.pin?`${f.d.name} pinned to the top of ${f.l.name}`:`${f.d.name} unpinned`);return;}

          found.push(...(j.places||[]).map(p=>({gid:p.id,name:p.displayName?.text||q,address:p.formattedAddress||'',lat:p.location?.latitude,lng:p.location?.longitude,lodging:(p.types||[]).includes('lodging')})));

  if(r.status===404)return null;
  if(!r.ok){const e=new Error('http '+r.status);e.status=r.status;throw e;}
  RK_OK=true;return r.json();

/* which Rakuten hotel a place is: saved on the place, or the nearest one within 120 m */
function hotelNo(o){
  if(o.rk)return o.rk.none?0:o.rk.no;
  const k='m:'+ckey(o.lat,o.lng),c=HC[k];
  if(c)return c.no||0;
  if(RK_OK===false)return 0;
  queueH(k,async()=>{const j=await hapi({action:'match',lat:o.lat,lng:o.lng});const h=(j?.hotels||[]).find(x=>x.m<=120);HC[k]={no:h?h.no:0,t:Date.now()};});
  return null;
}
function queueH(k,fn){
  if(HPEND[k])return;HPEND[k]=1;
  hjobs.push(async()=>{
    let wait=0;
    try{await fn();saveHC();}
    catch(e){if(e.status===429)wait=3000;}
    setTimeout(()=>{delete HPEND[k];},wait);soon();
  });
  hpump();
}
/* amenities (kept a month) and prices for the trip dates (kept 3 hours) */
function hotelData(o){
  const no=hotelNo(o);if(!no)return no===0?{none:1}:null;
  const tk=tripKey(),k=`i:${no}:${tk}`,c=HC[k];
  if(c&&Date.now()-c.t<(tk?3*3600e3:30*864e5))return c.d;
  if(RK_OK!==false){const [ci,co,a]=tk.split(':');queueH(k,async()=>{const d=await hapi({action:'info',no,...(tk?{checkin:ci,checkout:co,adults:a}:{})});HC[k]={d,t:Date.now()};if(d?.fx)HC.fx=d.fx;});}
  return c?c.d:null;
}
const usd=(yen,fx)=>'$'+Math.round(yen/fx.jpy).toLocaleString('en-US');
const yenf=y=>'¥'+Math.round(y).toLocaleString('en-US');
function priceText(pr,compact){
  if(!pr)return '';
  if(pr.soldOut)return '<span class="hsold">No rooms left on Rakuten for your dates</span>';
  const fx=HC.fx;
  const same=pr.min===pr.max;
  const u=fx?`${usd(pr.min,fx)}${same?'':'–'+usd(pr.max,fx)}`:'';
  const y=`${yenf(pr.min)}${same?'':'–'+yenf(pr.max)}`;
  return `<span class="hprice">${u?`<b>${u}</b> / night <small>(${y})</small>`:`<b>${y}</b> / night`}</span>${!compact&&pr.bfMin?`<small class="hbf">Breakfast plans from ${fx?usd(pr.bfMin,fx)+' ('+yenf(pr.bfMin)+')':yenf(pr.bfMin)}</small>`:''}`;
}
const amenTags=(a,compact)=>{const t=AMEN.filter(([k])=>!compact||a[k]);return t.length?`<span class="htags">${t.map(([k,l])=>`<span class="htag${a[k]?' on':''}" title="${a[k]?l:'No '+l.toLowerCase()+' listed'}">${a[k]?'✓':'✕'} ${compact&&k==='bath'?'Bath':l}</span>`).join('')}</span>`:'';};
/* block for a place card, the map card and expanded search results */
function hotelHtml(o,compact){

  if(!d)return `<div class="hotel${compact?'':' wait'}"><span class="hint" style="font-size:12px">Checking Rakuten Travel…</span></div>`;
  if(d.none)return compact?'':`<div class="hotel"><span class="hint" style="font-size:12px">Not found on Rakuten Travel.</span></div>`;

/* amenity filter: hide lodging known to lack a ticked amenity */
const hotelFiltering=()=>S.amen.length>0||S.maxUsd>0;
/* hotel filters: hide lodging known to lack a ticked amenity, or cheapest room over the max price */
/* why a hotel passes or fails the filters: ok, checking (still loading), none (not on Rakuten), amen, sold, price */
function hotelStatus(p){
  const d=hotelData(p);if(!d)return 'checking';if(d.none)return 'none';
  if(!S.amen.every(k=>d.amen[k]))return 'amen';
  if(S.maxUsd>0&&tripKey()){
    if(!d.price)return 'checking';
    if(d.price.soldOut)return 'sold';
    const fx=HC.fx;if(fx&&d.price.min/fx.jpy>S.maxUsd)return 'price';
  }
  return 'ok';
}
function amenOk(p){
  if(!hotelFiltering()||!LODGE(p)||!String(p.id).startsWith('d_'))return true;
  return !['amen','sold','price'].includes(hotelStatus(p));
}
/* "5 match · 20 over $300 · 8 no rooms · 3 missing amenity · checking 4…" */
function hotelSummary(list){
  const c={ok:0,none:0,checking:0,amen:0,sold:0,price:0};list.forEach(p=>c[hotelStatus(p)]++);
  const parts=[`${c.ok+c.none} match`];
  if(c.price)parts.push(`${c.price} over $${S.maxUsd}`);
  if(c.sold)parts.push(`${c.sold} no rooms`);
  if(c.amen)parts.push(`${c.amen} missing amenity`);
  if(c.checking)parts.push(`checking ${c.checking}…`);
  return parts.join(' · ');
}

function favHotel(o,quiet){

  const l=o.dotId&&layerOf(o.dotId),dot=l&&l.items.find(d=>d.id===o.dotId);
  if(!p){p={id:uid(),cat:CATS.housing?'housing':'other',name:o.name,lat:o.lat,lng:o.lng,address:o.address||'',notes:'',status:'want',photos:[],...(o.gid?{gid:o.gid}:{}),...(o.rk?{rk:o.rk}:{})};S.places.push(p);

/* Auto: reorder each trip's stops for the shortest total distance */
function tourCost(seq,start,end){let c=0,prev=start;for(const p of seq){if(prev)c+=miles(prev,p);prev=p;}if(end&&prev)c+=miles(prev,end);return c;}
function bestOrder(pts,start,end){
  const n=pts.length;if(n<2)return pts;
  let best=pts,bc=tourCost(pts,start,end);
  if(n<=9){
    const used=new Array(n).fill(false),cur=[];
    const rec=(prev,c)=>{
      if(c>=bc-1e-9)return;
      if(cur.length===n){const t=c+(end?miles(prev,end):0);if(t<bc-1e-9){bc=t;best=cur.map(i=>pts[i]);}return;}
      for(let i=0;i<n;i++)if(!used[i]){used[i]=true;cur.push(i);rec(pts[i],c+(prev?miles(prev,pts[i]):0));cur.pop();used[i]=false;}
    };
    rec(start,0);return best;
  }
  const nn=first=>{const left=pts.filter(p=>p!==first),out=first?[first]:[];let cur=first||start;while(left.length){left.sort((a,b)=>miles(cur,a)-miles(cur,b));cur=left.shift();out.push(cur);}return out;};
  const twoOpt=seq=>{let c=tourCost(seq,start,end),better=true;while(better){better=false;for(let i=0;i<seq.length-1;i++)for(let j=i+1;j<seq.length;j++){const t=[...seq.slice(0,i),...seq.slice(i,j+1).reverse(),...seq.slice(j+1)],tc=tourCost(t,start,end);if(tc<c-1e-9){seq=t;c=tc;better=true;}}}return seq;};
  for(const f of start?[null]:pts){const t=twoOpt(nn(f)),tc=tourCost(t,start,end);if(tc<bc-1e-9){bc=tc;best=t;}}
  return best;
}
let autoUndo=null;
function dayCost(d){
  const H=byId(S.homeId);let c=0;const segs=[[]];
  d.stops.forEach(id=>{if(H&&id===H.id)segs.push([]);else if(byId(id))segs[segs.length-1].push(byId(id));});
  segs.forEach((seg,i)=>{c+=tourCost(seg,H&&(i>0||d.loop)?H:null,H&&(i<segs.length-1||d.loop)?H:null);});

}
$('#autoBtn').onclick=()=>{
  const d=day(),H=byId(S.homeId);
  if(d.stops.filter(id=>!H||id!==H.id).length<2){if(d.stops.length){const rs=routeStops();autoUndo={dayId:d.id,stops:[...d.stops],modes:{...d.modes},after:d.stops.join()};for(let i=0;i<rs.length-1;i++){const a=rs[i].p,b=rs[i+1].p;d.modes[a.id+'>'+b.id]=autoMode(a,b);}save();refresh();toast('Picked travel for each leg');}else toast('Add stops first');return;}
  if(d.stops.filter(id=>!H||id!==H.id).length<2){toast('Add at least two stops first');return;}
  const before=dayCost(d);
  const segs=[[]];d.stops.forEach(id=>{if(H&&id===H.id)segs.push([]);else if(byId(id))segs[segs.length-1].push(byId(id));});
  const out=[];
  segs.forEach((seg,i)=>{
    if(i>0)out.push(H.id);
    out.push(...bestOrder(seg,H&&(i>0||d.loop)?H:null,H&&(i<segs.length-1||d.loop)?H:null).map(p=>p.id));
  });
  const same=out.join()===d.stops.join();
  autoUndo={dayId:d.id,stops:[...d.stops],modes:{...d.modes},after:out.join()};
  d.stops=out;d.modes={};
  const rs=routeStops();for(let i=0;i<rs.length-1;i++){const a=rs[i].p,b=rs[i+1].p;d.modes[a.id+'>'+b.id]=autoMode(a,b);}
  save();refresh();
  const saved=before-dayCost(d);
  toast(same?'Stops were already in the best order. Travel picked for each leg':saved>0.05?`Reordered to save about ${fmtMi(saved*1.3)} of travel, and picked travel for each leg`:'Reordered, and picked travel for each leg');
};
$('#undoAuto').onclick=()=>{
  const d=S.days.find(x=>x.id===autoUndo?.dayId);if(!d)return;
  d.stops=autoUndo.stops;d.modes=autoUndo.modes;autoUndo=null;save();refresh();toast('Back to your previous order');
};
$('#route').onclick=e=>{const d=day();
  const mv=e.target.closest('[data-mv]');if(mv){const i=+mv.dataset.i,j=i+ +mv.dataset.mv;if(j>=0&&j<d.stops.length){[d.stops[i],d.stops[j]]=[d.stops[j],d.stops[i]];save();refresh();}return;}
  const ha=e.target.closest('[data-homeafter]');if(ha){d.stops.splice(+ha.dataset.homeafter+1,0,S.homeId);save();refresh();toast('Home break added');return;}
  const he=e.target.closest('[data-homeend]');if(he){d.stops.push(S.homeId);save();refresh();toast('New trip started. Add stops to it below.');return;}
  const rm=e.target.closest('[data-rm]');if(rm){const [id]=d.stops.splice(+rm.dataset.rm,1);requeue(id);save();refresh();toast(id===S.homeId?'Home break removed':`Removed from ${d.name}`);return;}
  const st=e.target.closest('.stop');if(st&&!e.target.closest('button,a,select'))select(st.dataset.pid);};
$('#route').onchange=e=>{

/* phone dashboard has three heights: 'min' (title bar only), 'half' (default) and 'full' (whole screen) */
const phone=()=>matchMedia('(max-width:820px)').matches;
const sheetState=()=>document.body.classList.contains('collapsed')?'min':document.body.classList.contains('full')?'full':'half';
function setSheet(st){

/* phones: at the top of a list, keep pulling down to shrink the dashboard; at the bottom, keep pushing up to make it full screen */
(function(){
  let py=0,lim=null,ly=0;
  document.querySelectorAll('.tabpane').forEach(p=>{
    p.addEventListener('touchstart',e=>{py=e.touches[0].clientY;lim=null;},{passive:true});
    p.addEventListener('touchmove',e=>{
      if(!phone()||lim==='done')return;
      const y=e.touches[0].clientY,d=y-py;py=y;
      const top=p.scrollTop<=0,bot=p.scrollTop+p.clientHeight>=p.scrollHeight-1;
      if(d>0&&top){if(lim!=='top'){lim='top';ly=y;}if(y-ly>70){lim='done';setSheet(sheetState()==='full'?'half':'min');}}
      else if(d<0&&bot){if(lim!=='bot'){lim='bot';ly=y;}if(ly-y>70){lim='done';if(sheetState()==='half')setSheet('full');}}
      else if(d!==0)lim=null;
    },{passive:true});
  });
})();
/* swipe the handle, title bar or tabs: the dashboard follows the finger, then settles on the next height in that direction */
(function(){
  const panel=$('#panel');let y0=0,h0=0,st0='half',drag=false,moved=false,noClick=false;
  const bar=()=>panel.querySelector('header').offsetHeight+panel.querySelector('.grab').offsetHeight;
  const pos=st=>st==='full'?0:st==='half'?innerHeight*0.52:innerHeight-bar();
  panel.addEventListener('touchstart',e=>{
    drag=false;
    if(!phone()||e.touches.length!==1||!e.target.closest('.grab,header,nav.tabs')||e.target.closest('input,select'))return;
    drag=true;moved=false;y0=e.touches[0].clientY;st0=sheetState();h0=pos(st0);
  },{passive:true});
  panel.addEventListener('touchmove',e=>{
    if(!drag)return;
    const dy=e.touches[0].clientY-y0;
    if(!moved&&Math.abs(dy)<8)return;
    if(!moved){moved=true;document.body.classList.add('dragging');document.body.classList.remove('collapsed','full');}
    e.preventDefault();
    const mh=Math.max(0,Math.min(innerHeight-bar(),h0+dy));
    document.body.style.gridTemplateRows=`${mh}px minmax(0,1fr)`;
  },{passive:false});
  const end=e=>{
    if(!drag)return;drag=false;if(!moved)return;
    const dy=(e.changedTouches[0]?.clientY??y0)-y0,mh=Math.max(0,Math.min(innerHeight-bar(),h0+dy));
    document.body.classList.remove('dragging');document.body.style.gridTemplateRows='';
    if(st0==='min')document.body.classList.add('collapsed');if(st0==='full')document.body.classList.add('full');
    let to=st0;
    if(Math.abs(dy)>40){
      const ahead=['full','half','min'].filter(st=>dy<0?pos(st)<h0-1:pos(st)>h0+1);
      if(ahead.length)to=ahead.sort((a,b)=>Math.abs(pos(a)-mh)-Math.abs(pos(b)-mh))[0];
    }
    setSheet(to);noClick=true;setTimeout(()=>noClick=false,400);
  };
  panel.addEventListener('touchend',end);panel.addEventListener('touchcancel',end);
  panel.addEventListener('click',e=>{if(noClick){e.stopPropagation();e.preventDefault();}},true);
})();
function renderHome(){const h=byId(S.homeId);$('#homePill').innerHTML=h?`<span>Home base</span><b>${esc(h.name)}</b>`:'No home base set';}
function refresh(){rebuildCats();S.days.forEach(normalizeDay);renderHome();renderChips();renderHotelBar();renderList();renderDots();renderGroups();renderMarkers();renderRoute();}
/* panel resize (desktop) and collapse (mobile) */
(function(){
  try{const w=+localStorage.getItem('tokyo-planner-pw');if(w)document.body.style.setProperty('--pw',w+'px');}catch(e){}
  const rz=$('#resizer');let startX=0,startW=0;
  const move=e=>{const w=Math.max(320,Math.min(window.innerWidth*0.7,startW+e.clientX-startX));document.body.style.setProperty('--pw',w+'px');map.invalidateSize();};
  const up=e=>{rz.classList.remove('drag');window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);try{localStorage.setItem('tokyo-planner-pw',parseInt(getComputedStyle(document.body).getPropertyValue('--pw')))}catch(err){}map.invalidateSize();};
  rz.addEventListener('pointerdown',e=>{e.preventDefault();startX=e.clientX;startW=$('#panel').getBoundingClientRect().width;rz.classList.add('drag');window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);});
  rz.addEventListener('keydown',e=>{if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;const w=$('#panel').getBoundingClientRect().width+(e.key==='ArrowRight'?20:-20);document.body.style.setProperty('--pw',Math.max(320,Math.min(window.innerWidth*0.7,w))+'px');map.invalidateSize();});
  /* when the dashboard is hidden on a phone, tapping its title bar brings it back */
  $('#panel header').addEventListener('click',()=>{if(document.body.classList.contains('collapsed'))setCollapsed(false);setCatOpen(false);});
  $('#panel .grab').addEventListener('click',()=>{if(document.body.classList.contains('collapsed'))setCollapsed(false);setCatOpen(false);});
})();
settleHotelFavs();placeCatbar();save();refresh();syncRouteBtn();fillAddresses();
</script>
